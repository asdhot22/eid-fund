<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صندوق الاجتماع السنوي</title>
<style>
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f5f7;color:#111827}
.wrap{max-width:900px;margin:auto;padding:16px}
h1{margin:8px 0 4px}
.sub{color:#6b7280;font-size:14px;margin-bottom:14px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.card{background:#fff;border:1px solid #ddd;border-radius:14px;padding:14px;margin-bottom:12px}
.stat span{color:#6b7280;font-size:13px}.stat b{display:block;font-size:24px;margin-top:6px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
button{border:0;border-radius:10px;padding:10px 14px;font-size:15px;cursor:pointer}
.primary{background:#111827;color:#fff}.secondary{background:#fff;border:1px solid #ccc}.green{background:#dcfce7;color:#166534}.yellow{background:#fef3c7;color:#92400e}.red{background:#fee2e2;color:#991b1b}.blue{background:#e0f2fe;color:#075985}
.form{display:none}.form.show{display:block}
label{display:block;margin:8px 0 5px;color:#6b7280;font-size:13px}
input,select{width:100%;padding:11px;border:1px solid #ccc;border-radius:9px;font-size:15px;background:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.member{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #eee}
.member:last-child{border-bottom:0}.name{font-weight:700}.small{font-size:12px;color:#6b7280}.ok{color:#15803d;font-weight:700}.bad{color:#b91c1c;font-weight:700}
.reportrow{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
@media(max-width:700px){
.stats{grid-template-columns:repeat(2,1fr)}
.grid{grid-template-columns:1fr}
.member{grid-template-columns:1fr 1fr}.member .actions{grid-column:1/-1}
}
</style>
</head>
<body>
<div class="wrap">
<h1>صندوق الاجتماع السنوي</h1>
<div class="sub">1448هـ • 9 أشهر × 50 ريال = 450 ريال • من 27 محرم إلى 27 رمضان • عدد المشتركين مفتوح</div>
<div id="cloudStatus" class="small" style="margin-bottom:12px;color:#6b7280">جاري الاتصال بقاعدة البيانات...</div>

<div class="stats">
<div class="card stat"><span>المشتركين</span><b id="stMembers">0</b></div>
<div class="card stat"><span>المحصل</span><b id="stTotal">0 ر.س</b></div>
<div class="card stat"><span>المطلوب حتى الآن</span><b id="stDue">0 ر.س</b></div>
<div class="card stat"><span>المتأخرات</span><b id="stLate">0 ر.س</b></div>
</div>

<div class="toolbar">
<button class="primary" onclick="showAdd()">+ إضافة مشترك</button>
<button class="primary" onclick="showPayment()">+ إضافة دفعة</button>
<button class="secondary" onclick="showReport()">التقرير</button>
<button class="secondary" onclick="showMembers()">المشتركين</button>
</div>

<div id="addSection" class="card form">
<h3 id="formTitle">إضافة مشترك</h3>
<div class="grid">
<div><label>الاسم</label><input id="memberName"></div>
<div><label>رقم الجوال</label><input id="memberPhone" placeholder="05xxxxxxxx"></div>
</div>
<div class="toolbar" style="margin-top:12px">
<button class="primary" onclick="saveMember()">حفظ</button>
<button class="secondary" onclick="hideSections()">إلغاء</button>
</div>
</div>

<div id="paymentSection" class="card form">
<h3>إضافة دفعة</h3>
<div class="grid">
<div><label>المشترك</label><select id="paymentMember"></select></div>
<div><label>عدد الأشهر</label>
<select id="paymentMonths" onchange="updateAmount()">
<option value="1">1 شهر</option><option value="2">2 شهر</option><option value="3">3 أشهر</option>
<option value="4">4 أشهر</option><option value="5">5 أشهر</option><option value="6">6 أشهر</option>
<option value="7">7 أشهر</option><option value="8">8 أشهر</option><option value="9">9 أشهر</option>
</select></div>
<div><label>المبلغ</label><input id="paymentAmount" readonly></div>
<div><label>ملاحظة</label><input id="paymentNote"></div>
</div>
<div class="toolbar" style="margin-top:12px">
<button class="primary" onclick="savePayment()">تسجيل الدفعة</button>
<button class="secondary" onclick="hideSections()">إلغاء</button>
</div>
</div>

<div id="membersSection" class="card">
<h3>المشتركين</h3>
<div id="membersList"></div>
<div id="emptyText" class="small" style="text-align:center;padding:20px">لا يوجد مشتركون</div>
</div>

<div id="reportSection" class="card form">
<h3>التقرير</h3>
<div id="reportList"></div>
</div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
var firebaseConfig={
  apiKey:"AIzaSyDLwfT8K3Pfv90CNhCrZ_NzSwSYXj2gB6g",
  authDomain:"eid-fund-a01ad.firebaseapp.com",
  projectId:"eid-fund-a01ad",
  storageBucket:"eid-fund-a01ad.firebasestorage.app",
  messagingSenderId:"246702939725",
  appId:"1:246702939725:web:f5e371cb96a94fb0e2c604"
};
firebase.initializeApp(firebaseConfig);
var firestore=firebase.firestore();
var stateDoc=firestore.collection("app").doc("state");
var cloudReady=false;
var applyingCloud=false;

var MONTHLY=50;
var TOTAL_MONTHS=9;
var TOTAL_YEAR=450;
var now=new Date();

var hijriSchedule=[
  {name:'محرم', hijri:'27 محرم 1448', greg:'12/07/2026', due:'2026-07-12'},
  {name:'صفر', hijri:'27 صفر 1448', greg:'10/08/2026', due:'2026-08-10'},
  {name:'ربيع الأول', hijri:'27 ربيع الأول 1448', greg:'09/09/2026', due:'2026-09-09'},
  {name:'ربيع الآخر', hijri:'27 ربيع الآخر 1448', greg:'08/10/2026', due:'2026-10-08'},
  {name:'جمادى الأولى', hijri:'27 جمادى الأولى 1448', greg:'07/11/2026', due:'2026-11-07'},
  {name:'جمادى الآخرة', hijri:'27 جمادى الآخرة 1448', greg:'07/12/2026', due:'2026-12-07'},
  {name:'رجب', hijri:'27 رجب 1448', greg:'05/01/2027', due:'2027-01-05'},
  {name:'شعبان', hijri:'27 شعبان 1448', greg:'04/02/2027', due:'2027-02-04'},
  {name:'رمضان', hijri:'27 رمضان 1448', greg:'06/03/2027', due:'2027-03-06'}
];

function dueInstallmentsNow(){
  var today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  var c=0;
  for(var i=0;i<hijriSchedule.length;i++){
    var p=hijriSchedule[i].due.split('-');
    var d=new Date(Number(p[0]),Number(p[1])-1,Number(p[2]));
    if(today>=d) c++;
  }
  return c;
}
var currentDueCount=dueInstallmentsNow();

var db={members:[],payments:[]};
var editId=null;

function normalizeDB(){
  if(!db || typeof db!=='object') db={members:[],payments:[]};
  if(!Array.isArray(db.members)) db.members=[];
  if(!Array.isArray(db.payments)) db.payments=[];
  for(var i=0;i<db.members.length;i++){
    if(typeof db.members[i].active==='undefined') db.members[i].active=true;
  }
}

function loadLocalDB(){
  try{
    var saved=localStorage.getItem('eidFundSimple');
    if(saved){ db=JSON.parse(saved); }
  }catch(e){ db={members:[],payments:[]}; }
  normalizeDB();
}

function setCloudStatus(text,color){
  var el=document.getElementById('cloudStatus');
  if(!el) return;
  el.innerHTML=text;
  if(color) el.style.color=color;
}

function connectCloud(){
  stateDoc.onSnapshot(function(doc){
    if(doc.exists){
      applyingCloud=true;
      var data=doc.data()||{};
      db={
        members:Array.isArray(data.members)?data.members:[],
        payments:Array.isArray(data.payments)?data.payments:[]
      };
      normalizeDB();
      localStorage.setItem('eidFundSimple',JSON.stringify(db));
      cloudReady=true;
      setCloudStatus('☁️ البيانات متصلة ومحفوظة على Firebase','#15803d');
      renderAll();
      applyingCloud=false;
    }else{
      cloudReady=true;
      normalizeDB();
      stateDoc.set({
        members:db.members,
        payments:db.payments,
        updatedAt:firebase.firestore.FieldValue.serverTimestamp()
      }).then(function(){
        setCloudStatus('☁️ تم نقل البيانات الحالية إلى Firebase','#15803d');
      }).catch(function(err){
        console.error(err);
        setCloudStatus('تعذر رفع البيانات إلى Firebase - العمل محليًا فقط','#b91c1c');
      });
    }
  },function(err){
    console.error(err);
    cloudReady=false;
    setCloudStatus('تعذر الاتصال بـ Firebase - العمل محليًا مؤقتًا','#b91c1c');
    renderAll();
  });
}

function saveDB(){
  normalizeDB();
  localStorage.setItem('eidFundSimple',JSON.stringify(db));
  renderAll();

  if(cloudReady && !applyingCloud){
    stateDoc.set({
      members:db.members,
      payments:db.payments,
      updatedAt:firebase.firestore.FieldValue.serverTimestamp()
    }).then(function(){
      setCloudStatus('☁️ تم الحفظ والمزامنة','#15803d');
    }).catch(function(err){
      console.error(err);
      setCloudStatus('تم الحفظ محليًا، لكن فشلت المزامنة','#b91c1c');
    });
  }
}

function hideSections(){
  document.getElementById('addSection').className='card form';
  document.getElementById('paymentSection').className='card form';
  document.getElementById('reportSection').className='card form';
  document.getElementById('membersSection').style.display='none';
}

function showAdd(){
  hideSections();
  editId=null;
  document.getElementById('formTitle').innerHTML='إضافة مشترك';
  document.getElementById('memberName').value='';
  document.getElementById('memberPhone').value='';
  document.getElementById('addSection').className='card form show';
}

function showEdit(id){
  hideSections();
  var m=findMember(id);
  if(!m) return;
  editId=id;
  document.getElementById('formTitle').innerHTML='تعديل المشترك';
  document.getElementById('memberName').value=m.name;
  document.getElementById('memberPhone').value=m.phone||'';
  document.getElementById('addSection').className='card form show';
}

function showPayment(){
  hideSections();
  fillMemberSelect();
  updateAmount();
  document.getElementById('paymentSection').className='card form show';
}

function showReport(){
  hideSections();
  renderReport();
  document.getElementById('reportSection').className='card form show';
}

function showMembers(){
  hideSections();
  document.getElementById('membersSection').style.display='block';
}

function saveMember(){
  var name=document.getElementById('memberName').value.trim();
  var phone=document.getElementById('memberPhone').value.trim();
  if(!name){ alert('اكتب اسم المشترك'); return; }

  if(editId){
    var m=findMember(editId);
    if(m){
      m.name=name;
      m.phone=phone;
    }
  }else{
    db.members.push({
      id:(new Date()).getTime(),
      name:name,
      phone:phone,
      active:true
    });
  }

  editId=null;
  saveDB();
  showMembers();
}

function stopMember(id){
  var m=findMember(id);
  if(!m) return;

  if(confirm('إيقاف المشترك؟ ستبقى دفعاته محفوظة.')){
    m.active=false;
    saveDB();
  }
}

function findMember(id){
  for(var i=0;i<db.members.length;i++){
    if(db.members[i].id==id) return db.members[i];
  }
  return null;
}

function paidTotal(id){
  var t=0;
  for(var i=0;i<db.payments.length;i++){
    if(db.payments[i].memberId==id){
      t+=Number(db.payments[i].amount||0);
    }
  }
  return t;
}

function paidMonths(id){
  return Math.floor(paidTotal(id)/MONTHLY);
}

function overdueMonths(id){
  var p=paidMonths(id);
  if(p>TOTAL_MONTHS) p=TOTAL_MONTHS;

  var late=currentDueCount-p;
  if(late<0) late=0;

  return late;
}

function remainingYear(id){
  var r=TOTAL_YEAR-paidTotal(id);
  return r<0?0:r;
}

function fillMemberSelect(){
  var s=document.getElementById('paymentMember');
  s.innerHTML='';

  for(var i=0;i<db.members.length;i++){
    if(db.members[i].active!==false){
      var o=document.createElement('option');
      o.value=db.members[i].id;
      o.text=db.members[i].name;
      s.appendChild(o);
    }
  }
}

function updateAmount(){
  var count=Number(document.getElementById('paymentMonths').value||1);
  document.getElementById('paymentAmount').value=(count*MONTHLY)+' ريال';
}

function savePayment(){
  var sid=document.getElementById('paymentMember').value;

  if(!sid){
    alert('أضف مشترك أولاً');
    return;
  }

  var count=Number(document.getElementById('paymentMonths').value||1);

  db.payments.push({
    id:(new Date()).getTime(),
    memberId:Number(sid),
    months:count,
    amount:count*MONTHLY,
    note:document.getElementById('paymentNote').value||'',
    date:new Date().toISOString()
  });

  document.getElementById('paymentMonths').value='1';
  document.getElementById('paymentNote').value='';

  saveDB();
  showMembers();
}

function renderMembers(){
  var box=document.getElementById('membersList');
  box.innerHTML='';

  var count=0;

  for(var i=0;i<db.members.length;i++){
    var m=db.members[i];

    if(m.active===false) continue;

    count++;
    var late=overdueMonths(m.id);

    var d=document.createElement('div');
    d.className='member';

    d.innerHTML=
      '<div><div class="name">'+safe(m.name)+'</div><div class="small">'+safe(m.phone||'')+'</div></div>'+
      '<div class="'+(late?'bad':'ok')+'">'+(late?('متأخر '+late+' شهر'):'منتظم')+'</div>'+
      '<div>'+paidTotal(m.id)+' ر.س</div>'+
      '<div class="actions">'+
      '<button class="green" onclick="quickPay('+m.id+')">+ دفعة</button> '+
      '<button class="yellow" onclick="showEdit('+m.id+')">تعديل</button> '+
      '<button class="green" onclick="sendWhatsApp('+m.id+')">واتساب</button> '+
      '<button class="blue" onclick="sendSMS('+m.id+')">SMS</button> '+
      '<button class="red" onclick="stopMember('+m.id+')">إيقاف</button>'+
      '</div>';

    box.appendChild(d);
  }

  document.getElementById('emptyText').style.display=count?'none':'block';
}

function quickPay(id){
  showPayment();
  document.getElementById('paymentMember').value=String(id);
}

function buildMessage(id){
  var m=findMember(id);
  if(!m) return '';

  var paid=paidTotal(id);
  var months=paidMonths(id);
  var late=overdueMonths(id);
  var remaining=remainingYear(id);

  return 'السلام عليكم '+m.name+'\n'+
         'صندوق الاجتماع السنوي\n'+
         'إجمالي المسدد: '+paid+' ريال ('+Math.min(months,9)+' من 9 أشهر)\n'+
         'المتأخر حتى الآن: '+late+' شهر = '+(late*50)+' ريال\n'+
         'المتبقي لإكمال دورة الاشتراك: '+remaining+' ريال\n'+
         'وشكرًا لك';
}

function normalizePhone(p){
  var x=String(p||'').replace(/\D/g,'');

  if(x.indexOf('05')===0){
    x='966'+x.substring(1);
  }else if(x.indexOf('5')===0){
    x='966'+x;
  }

  return x;
}

function sendWhatsApp(id){
  var m=findMember(id);

  if(!m || !m.phone){
    alert('لا يوجد رقم جوال لهذا المشترك');
    return;
  }

  var phone=normalizePhone(m.phone);
  var url='https://wa.me/'+phone+'?text='+encodeURIComponent(buildMessage(id));

  window.open(url,'_blank');
}

function sendSMS(id){
  var m=findMember(id);

  if(!m || !m.phone){
    alert('لا يوجد رقم جوال لهذا المشترك');
    return;
  }

  var body=encodeURIComponent(buildMessage(id));
  window.location.href='sms:'+m.phone+'?&body='+body;
}

function renderReport(){
  var box=document.getElementById('reportList');
  box.innerHTML='';

  for(var i=0;i<db.members.length;i++){
    var m=db.members[i];
    var late=overdueMonths(m.id);

    var d=document.createElement('div');
    d.className='reportrow';

    d.innerHTML=
      '<div><b>'+safe(m.name)+'</b>'+(m.active===false?'<div class="small">مشترك سابق</div>':'')+'</div>'+
      '<div style="text-align:left">'+
      '<div>المدفوع: '+paidTotal(m.id)+' ر.س</div>'+
      '<div class="'+(late?'bad':'ok')+'">'+(late?('متأخر '+late+' شهر = '+(late*50)+' ر.س'):'لا توجد متأخرات')+'</div>'+
      '<div class="small">المتبقي من 9 أشهر: '+remainingYear(m.id)+' ر.س</div>'+
      '</div>';

    box.appendChild(d);
  }
}

function renderStats(){
  var active=0;
  var total=0;
  var late=0;

  for(var i=0;i<db.members.length;i++){
    if(db.members[i].active!==false){
      active++;
      late+=overdueMonths(db.members[i].id)*MONTHLY;
    }
  }

  for(var j=0;j<db.payments.length;j++){
    total+=Number(db.payments[j].amount||0);
  }

  document.getElementById('stMembers').innerHTML=active;
  document.getElementById('stTotal').innerHTML=total+' ر.س';
  document.getElementById('stDue').innerHTML=(active*currentDueCount*MONTHLY)+' ر.س';
  document.getElementById('stLate').innerHTML=late+' ر.س';
}

function renderAll(){
  renderStats();
  renderMembers();
  fillMemberSelect();
  updateAmount();
  renderReport();
}

function safe(s){
  s=String(s||'');

  return s
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

loadLocalDB();
renderAll();
showMembers();
connectCloud();
</script>
</body>
</html>
